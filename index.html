<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>GIG QUEST | Learning Adventure</title><style>
:root{font-family:Inter,system-ui,Segoe UI,sans-serif;color:#f4ecff;background:#0c0b1b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 20% 0,#34205b 0,transparent 45%),#0c0b1b;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.app{max-width:1240px;margin:auto;padding:20px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.logo{font-weight:950;font-size:24px;letter-spacing:2px}.logo span{color:#b996ff}.pill{border:1px solid #59467d;border-radius:99px;padding:8px 12px;background:#211735;font-size:13px}.nav{display:flex;gap:7px;overflow:auto;padding:17px 0}.nav button,.secondary{background:#201933;color:#eee2ff;border:1px solid #564479;border-radius:12px;padding:11px 16px;white-space:nowrap}.nav button.active{background:linear-gradient(110deg,#7043d0,#aa5bca);border-color:#b48af4}.panel{background:linear-gradient(145deg,#241938,#141326);border:1px solid #4a3967;border-radius:22px;padding:22px;box-shadow:0 16px 40px #0004}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:15px}.hero{min-height:235px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 30%,#4c397e,#19142c 65%);border:1px solid #6b5396;border-radius:18px}.avatar{font-size:94px;filter:drop-shadow(0 12px 18px #0008);animation:float 3s ease-in-out infinite}@keyframes float{50%{transform:translateY(-10px)}}.hero small{color:#d5c4ed}.primary{background:linear-gradient(110deg,#8052ed,#b35ed3);color:white;border:0;border-radius:12px;padding:12px 19px;font-weight:800}.gold{color:#f7d482}.muted{color:#c3b5d9}.headline{font-size:clamp(26px,4vw,48px);line-height:1.05;margin:15px 0}.progress{height:11px;background:#413650;border-radius:20px;overflow:hidden}.progress>i{display:block;height:100%;background:linear-gradient(90deg,#7c54f3,#f0adfd);transition:width .4s}.stage{border:1px solid #5c497d;background:#20172f;border-radius:17px;padding:17px;display:flex;flex-direction:column;gap:9px}.stage.done{border-color:#6bcda4}.stage.locked{opacity:.58}.stage .emoji{font-size:40px}.battle{display:grid;grid-template-columns:1fr 1fr;gap:15px}.fighter{background:radial-gradient(circle,#51396e,#1a142a 70%);border:1px solid #6e4f93;border-radius:17px;text-align:center;padding:16px}.fighter .avatar{font-size:88px}.question{background:#171126;border:1px solid #56416d;border-radius:18px;padding:19px;margin-top:15px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:9px}.answers button{min-height:60px;text-align:left;padding:13px;border-radius:11px;background:#35264c;border:1px solid #6e538b;color:white}.answers button:hover{background:#58367d}.notice{padding:12px;background:#34264d;border-radius:12px;margin:12px 0}.island{background:radial-gradient(ellipse at bottom,#405d63,#23173c 65%);text-align:center;padding:25px;border-radius:18px;border:1px solid #66528d}.island .art{font-size:76px}.shopcard{text-align:center}.shopcard .art{font-size:70px}.stats{display:flex;gap:9px;flex-wrap:wrap}h2{margin:8px 0 16px}h3{margin:8px 0}p{line-height:1.5}.hidden{display:none!important}.badge{font-size:12px;background:#43305e;border-radius:8px;padding:5px 9px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.form{display:grid;gap:10px;max-width:460px}input,select{background:#171124;color:#fff;border:1px solid #6b518d;border-radius:10px;padding:12px;width:100%}.log{max-height:180px;overflow:auto;font-size:13px;color:#d5c3e8}.footer{color:#9485ab;text-align:center;padding:25px;font-size:12px}@media(max-width:550px){.app{padding:12px}.panel{padding:15px}.answers{grid-template-columns:1fr}.fighter .avatar{font-size:64px}.nav button{padding:9px 12px}.logo{font-size:20px}}
</style></head><body><div class="app"><header class="top"><div class="logo">✦ GIG <span>QUEST</span><div style="font-size:10px;letter-spacing:3px;color:#bba7df">THE LEARNING ADVENTURE</div></div><div class="stats"><span class="pill">⭐ <b id="level">1</b> LVL</span><span class="pill">✨ <b id="xp">0</b> XP</span><span class="pill">🪙 <b id="gold">100</b> GOLD</span></div></header><nav class="nav" id="nav"></nav><main id="view"></main><div class="footer">GIG QUEST • Interactive learning prototype • Progress saved on this device only • Unofficial concept</div></div><script>
'use strict';
const STAGES=[['🏢','Company Introduction','Discover GIG and its values'],['🛡️','Insurance Benefits','Understand protection and peace of mind'],['⚔️','Protection Products','i-Guard • i-Protect • i-Shine'],['💎','Saving & Protection','i-Study • i-Start • i-Relax'],['📊','Presenting i-Quote','Match solutions to customer needs'],['📜','Underwriting','Explore risk and documentation'],['🤝','Customer Conversations','Build trust and handle objections'],['🏆','Final Exam','Prove your knowledge']];
const QUESTIONS=[
[{q:'What should a new employee learn first?',a:['Company values and purpose','Only product prices','Only the office layout','Only sales targets'],c:0},{q:'Which behavior best reflects a customer-first culture?',a:['Avoiding questions','Listening to customer needs','Making unsupported promises','Rushing the sale'],c:1}],
[{q:'What is the core purpose of insurance?',a:['Eliminate every possible risk','Provide financial protection against covered risks','Guarantee investment profits','Replace all savings'],c:1},{q:'What should be clear to a customer?',a:['Coverage, exclusions and terms','Only the premium','Only the brochure design','Only the brand name'],c:0}],
[{q:'Before recommending a protection product, what comes first?',a:['Understanding the customer’s protection needs','Choosing the most expensive plan','Skipping disclosures','Guaranteeing claims'],c:0},{q:'What is a responsible product presentation?',a:['Explain benefits and limitations accurately','Promise every claim will be paid','Hide exclusions','Ignore affordability'],c:0}],
[{q:'Which factor matters when discussing savings and protection?',a:['Customer goals and time horizon','Only the highest contribution','Only the agent’s preference','No customer questions'],c:0},{q:'What should you avoid when discussing future outcomes?',a:['Clear explanations','Unsupported guarantees','Written disclosures','Checking understanding'],c:1}],
[{q:'What makes a good quotation presentation?',a:['Linking benefits to identified needs','Reading numbers without context','Ignoring affordability','Skipping conditions'],c:0},{q:'A customer is confused by a quotation. You should…',a:['Move on quickly','Explain the assumptions and terms','Dismiss their concern','Ask them not to read it'],c:1}],
[{q:'What is underwriting primarily about?',a:['Assessing and classifying risk','Advertising a product','Designing a logo','Guaranteeing acceptance'],c:0},{q:'Why does accurate application information matter?',a:['It supports fair risk assessment','It is optional','It only helps marketing','It removes every exclusion'],c:0}],
[{q:'A customer says the premium is high. What is your best response?',a:['Explore the concern and explain value','Argue immediately','Promise a discount you cannot give','End the conversation'],c:0},{q:'Which skill strengthens trust?',a:['Active listening','Interrupting','Overpromising','Avoiding objections'],c:0}],
[{q:'Which behavior best supports ethical sales?',a:['Accurate disclosures and suitability','Hiding important limitations','Pressure selling','Inventing returns'],c:0},{q:'What should a salesperson do if unsure about a policy condition?',a:['Guess confidently','Verify using approved sources','Ignore the question','Make a promise'],c:1}]
];
const CLASSES=[['🧙‍♂️','Wizard','Arcane Strike'],['🛡️','Defender','Guardian Slam'],['✨','Augmenter','Power Surge'],['💚','Healer','Nature Pulse']];
const SHOP=[['🦉','Arcane Owl',80],['🐒','Spark Monkey',90],['🗡️','Crystal Blade',60],['👑','Royal Crown',110],['🌌','Nebula Aura',70],['🛡️','Guardian Shield',65]];
const initial={name:'GIG Adventurer',class:0,gender:'Male',xp:0,gold:100,completed:[],inventory:[],team:'Purple Guardians',bonuses:[],history:[]};
let s;try{s={...initial,...JSON.parse(localStorage.getItem('gigquest_v3')||'{}')}}catch(e){s={...initial}}let page='Home',battle=null;
function save(){try{localStorage.setItem('gigquest_v3',JSON.stringify(s))}catch(e){}updateHeader()}
function updateHeader(){document.getElementById('level').textContent=Math.floor(s.xp/200)+1;document.getElementById('xp').textContent=s.xp;document.getElementById('gold').textContent=s.gold}
function el(str){document.getElementById('view').innerHTML=str}
function btn(label,fn,kind='primary'){return `<button class="${kind}" onclick="${fn}">${label}</button>`}
function safe(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function hero(){return CLASSES[s.class][0]}
function go(p){page=p;render()}
function render(){updateHeader();document.getElementById('nav').innerHTML=['Home','Characters','World Map','Battle','Teams','Shop','Trainer'].map(n=>`<button class="${page===n?'active':''}" onclick="go('${n}')">${({Home:'🏠',Characters:'🧙', 'World Map':'🗺️',Battle:'⚔️',Teams:'🏝️',Shop:'🛒',Trainer:'🎓'})[n]} ${n}</button>`).join('');if(page==='Home')home();if(page==='Characters')characters();if(page==='World Map')world();if(page==='Battle')showBattle();if(page==='Teams')teams();if(page==='Shop')shop();if(page==='Trainer')trainer()}
function home(){let pct=Math.round(s.completed.length/8*100);el(`<section class="panel"><div class="row"><div><span class="badge">WELCOME, ${safe(s.name)}</span><h1 class="headline">Your adventure.<br><span style="color:#b98bff">Your growth.</span></h1><p class="muted">Choose a hero, explore the learning islands, defeat knowledge guardians, and unlock rewards.</p>${btn('🗺️ Continue Journey',"go('World Map')")}</div><div class="hero" style="width:min(100%,300px)"><div class="avatar">${hero()}</div><b>${CLASSES[s.class][1]}</b><small>${safe(s.team)}</small></div></div><h3>Learning Journey • ${pct}%</h3><div class="progress"><i style="width:${pct}%"></i></div><p class="muted">${s.completed.length} / 8 chapters cleared • Level ${Math.floor(s.xp/200)+1}</p></section><div class="grid" style="margin-top:15px"><div class="panel"><h3>⚔️ Knowledge Battles</h3><p>Correct answers unleash attacks. Defeat the guardian to complete each chapter.</p>${btn('Enter Arena',"go('Battle')")}</div><div class="panel"><h3>🏝️ Your Team Island</h3><p>Build your island and celebrate shared achievements.</p>${btn('Visit Island',"go('Teams')")}</div><div class="panel"><h3>🛒 Rewards Shop</h3><p>Spend earned Gold on pets, outfits and gear.</p>${btn('Explore Shop',"go('Shop')")}</div></div>`)}
function characters(){el(`<section class="panel"><h2>Choose Your RPG Character</h2><p class="muted">Each class has its own fantasy identity and signature attack.</p><div class="row"><label>Character name <input id="playerName" maxlength="28" value="${safe(s.name)}"></label><label>Appearance <select id="gender"><option ${s.gender==='Male'?'selected':''}>Male</option><option ${s.gender==='Female'?'selected':''}>Female</option></select></label></div><div class="grid" style="margin-top:16px">${CLASSES.map((c,i)=>`<div class="hero" style="outline:${s.class===i?'3px solid #c49aff':'none'}"><div class="avatar">${c[0]}</div><h3>${c[1]}</h3><small>Special ability: ${c[2]}</small>${btn(s.class===i?'✓ Selected':'Choose '+c[1],`choose(${i})`)}</div>`).join('')}</div><p style="margin-top:16px">${btn('💾 Save Hero Profile','saveHero()')}</p></section>`)}
function choose(i){s.class=i;save();characters()}
function saveHero(){s.name=document.getElementById('playerName').value.trim()||'GIG Adventurer';s.gender=document.getElementById('gender').value;save();characters();alert('Hero profile saved!')}
function world(){el(`<section class="panel"><h2>🗺️ World of Learning</h2><p class="muted">Eight chapters. Complete each guardian battle to unlock the next.</p><div class="grid">${STAGES.map((st,i)=>{let done=s.completed.includes(i),lock=i>0&&!s.completed.includes(i-1);return `<div class="stage ${done?'done':lock?'locked':''}"><div class="row"><span class="emoji">${st[0]}</span><span class="badge">${done?'✓ CLEARED':lock?'🔒 LOCKED':'AVAILABLE'}</span></div><h3>${i+1}. ${st[1]}</h3><div class="muted">${st[2]}</div>${btn(done?'Replay Mission':lock?'Locked':'Start Mission',`startBattle(${i})`,lock?'secondary':'primary').replace('<button','<button '+(lock?'disabled':'') )}</div>`}).join('')}</div></section>`)}
function startBattle(i){if(i>0&&!s.completed.includes(i-1)){alert('Complete the previous chapter first.');return}battle={stage:i,step:0,heroHP:100,bossHP:100,shield:1,guard:false,log:['⚔️ A guardian appears!']};page='Battle';render()}
function showBattle(){if(!battle){el(`<section class="panel"><h2>⚔️ RPG Knowledge Arena</h2><p>Choose an unlocked chapter on the World Map to challenge its guardian.</p>${btn('Open World Map',"go('World Map')")}</section>`);return}let b=battle,st=STAGES[b.stage],q=QUESTIONS[b.stage][b.step],ended=b.heroHP<=0||b.bossHP<=0||b.step>=2;el(`<section class="panel"><div class="row"><div><span class="badge">CHAPTER ${b.stage+1} • ${st[1]}</span><h2>⚔️ Guardian Encounter</h2></div>${btn('↩ World Map',"go('World Map')",'secondary')}</div><div class="battle"><div class="fighter"><div class="avatar">${hero()}</div><b>${safe(s.name)}</b><div class="muted">${CLASSES[s.class][2]}</div><p>❤️ ${b.heroHP} / 100</p><div class="progress"><i style="width:${b.heroHP}%;background:#58d6a3"></i></div></div><div class="fighter"><div class="avatar">${b.bossHP<=0?'💥':'👹'}</div><b>Shadow Guardian</b><div class="muted">Knowledge Boss</div><p>❤️ ${b.bossHP} / 100</p><div class="progress"><i style="width:${b.bossHP}%;background:#f76d9d"></i></div></div></div>${ended?`<div class="question" style="text-align:center"><h2>${b.bossHP<=0?'🏆 VICTORY!':'💀 TRY AGAIN'}</h2><p>${b.bossHP<=0?'Guardian defeated! Rewards earned and chapter unlocked.':'Review the knowledge and challenge the guardian again.'}</p>${btn('🔁 Replay Battle',`startBattle(${b.stage})`)} ${btn('🗺️ Continue Journey',"go('World Map')",'secondary')}</div>`:`<div class="question"><span class="badge">MISSION ${b.step+1} / 2</span><h3>${q.q}</h3><div class="answers">${q.a.map((a,i)=>`<button onclick="answer(${i})">${String.fromCharCode(65+i)}. ${a}</button>`).join('')}</div><p>${btn(b.guard?'🛡️ Shield Active':'🛡️ Activate Shield', 'activateShield()', 'secondary').replace('<button','<button '+(!b.shield||b.guard?'disabled':''))}</p></div>`}<div class="notice"><b>Battle Log</b><div class="log">${b.log.slice(-5).reverse().map(l=>`<p>${l}</p>`).join('')}</div></div></section>`)}
function activateShield(){if(battle&&battle.shield){battle.shield=0;battle.guard=true;battle.log.push('🛡️ Shield activated: blocks next wrong answer');showBattle()}}
function answer(i){let b=battle;if(!b||b.step>=2)return;let q=QUESTIONS[b.stage][b.step];if(i===q.c){b.bossHP=Math.max(0,b.bossHP-50);b.log.push(`✨ ${CLASSES[s.class][2]}! Correct answer. -50 Boss HP`)}else{let dmg=b.guard?0:35;b.heroHP=Math.max(0,b.heroHP-dmg);b.log.push(`💥 Incorrect! ${dmg} damage. Correct: ${q.a[q.c]}`)}b.guard=false;b.step++;if(b.bossHP<=0){if(!s.completed.includes(b.stage)){s.completed.push(b.stage);s.xp+=150;s.gold+=75;s.history.push('Cleared '+STAGES[b.stage][1]);save()}b.log.push('🏆 Chapter cleared! +150 XP, +75 Gold')}else if(b.step>=2&&b.heroHP>0){b.log.push('⚠️ Guardian survived. Replay to defeat it.')}showBattle()}
function teams(){let names=['Purple Guardians','Arcane Legends','Golden Defenders'];el(`<section class="panel"><h2>🏝️ Team Islands</h2><p class="muted">Select your team and grow its island as you complete chapters. Team scores are simulated locally in this prototype.</p><div class="grid">${names.map((name,i)=>`<div class="island"><div class="art">${['🏝️','🏰','🌋'][i]}</div><h3>${name}</h3><p class="muted">${name===s.team?'Your current team':'Join this team'}</p><div class="badge">Your contribution: ${s.completed.length*150} XP</div><p>${btn(name===s.team?'✓ Joined':'Join Team',`joinTeam(${i})`)}</p></div>`).join('')}</div><h3>Team Mission Board</h3><p>🎯 Clear 4 chapters • 🪙 Collect 300 Gold • 🏆 Defeat the final guardian</p><div class="progress"><i style="width:${Math.min(100,s.completed.length/4*100)}%"></i></div></section>`)}
function joinTeam(i){s.team=['Purple Guardians','Arcane Legends','Golden Defenders'][i];save();teams()}
function shop(){el(`<section class="panel"><div class="row"><h2>🛒 RPG Rewards Shop</h2><span class="pill gold">🪙 ${s.gold} Gold</span></div><p class="muted">Unlock cosmetic rewards with Gold earned from missions.</p><div class="grid">${SHOP.map((item,i)=>`<div class="panel shopcard"><div class="art">${item[0]}</div><h3>${item[1]}</h3><p class="gold">🪙 ${item[2]}</p>${btn(s.inventory.includes(i)?'✓ Owned':`Buy for ${item[2]} Gold`,`buy(${i})`,s.inventory.includes(i)?'secondary':'primary').replace('<button','<button '+(s.inventory.includes(i)?'disabled':''))}</div>`).join('')}</div><h3>Your Inventory</h3><p>${s.inventory.length?s.inventory.map(i=>SHOP[i][0]+' '+SHOP[i][1]).join(' • '):'No items yet. Win battles to earn Gold!'}</p></section>`)}
function buy(i){if(s.inventory.includes(i))return;if(s.gold<SHOP[i][2]){alert('Not enough Gold. Complete missions to earn more!');return}s.gold-=SHOP[i][2];s.inventory.push(i);s.history.push('Bought '+SHOP[i][1]);save();shop()}
function trainer(){el(`<section class="panel"><h2>🎓 Trainer Dashboard</h2><p class="muted">Local demo controls only. No authentication or real employee database is connected.</p><div class="grid"><div class="panel"><h3>📊 Learner Overview</h3><p>Employee: <b>${safe(s.name)}</b></p><p>Class: <b>${CLASSES[s.class][1]}</b></p><p>Team: <b>${safe(s.team)}</b></p><p>Chapters: <b>${s.completed.length}/8</b></p><p>XP: <b>${s.xp}</b></p></div><div class="panel"><h3>✨ Trainer Bonus / Deduction</h3><div class="form"><label>Reason<select id="reason"><option>Excellent engagement</option><option>Peer helper</option><option>Punctuality</option><option>Most improved</option><option>Lateness</option><option>Not listening</option></select></label><label>XP adjustment<select id="points"><option value="25">+25 XP</option><option value="50">+50 XP</option><option value="-25">-25 XP</option><option value="-50">-50 XP</option></select></label>${btn('Apply Adjustment','applyBonus()')}</div></div></div><h3>Activity Log</h3><div class="notice log">${s.history.length?s.history.slice().reverse().map(x=>`<p>• ${safe(x)}</p>`).join(''):'No activity yet.'}</div><p>${btn('Export Progress (JSON)','exportData()','secondary')} ${btn('Reset Demo Progress','resetDemo()','secondary')}</p></section>`)}
function applyBonus(){let n=Number(document.getElementById('points').value),reason=document.getElementById('reason').value;s.xp=Math.max(0,s.xp+n);s.history.push(`Trainer: ${reason} (${n>0?'+':''}${n} XP)`);save();trainer()}
function exportData(){let blob=new Blob([JSON.stringify(s,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='gig-quest-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function resetDemo(){if(confirm('Reset all local game progress?')){s={...initial,completed:[],inventory:[],bonuses:[],history:[]};save();go('Home')}}
window.addEventListener('error',e=>{let v=document.getElementById('view');if(v)v.innerHTML='<div class="panel"><h2>Game encountered an error</h2><p>'+safe(e.message)+'</p></div>'});render();
</script></body></html>
