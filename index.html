<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>GIG QUEST — Shadowfall Reborn</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#09091b;color:#fff;font-family:system-ui,-apple-system,Arial}body{overflow:hidden}#world{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 55%,#34205b 0%,#15132d 48%,#09091b 100%);overflow:hidden}#world:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 65px,#a77aff10 66px 67px),repeating-linear-gradient(90deg,transparent 0 65px,#a77aff10 66px 67px);transform:perspective(360px) rotateX(32deg) scale(1.5);opacity:.5}.orb{position:absolute;border-radius:50%;filter:blur(24px);background:#853eff55;width:180px;height:180px;left:10%;top:18%}.orb.two{left:72%;top:60%;background:#f32b8550}.entity{position:absolute;transform:translate(-50%,-50%);user-select:none;will-change:left,top}.hero{width:58px;height:75px;filter:drop-shadow(0 0 16px #9867ff)}.hero .hat{position:absolute;left:10px;top:0;width:38px;height:35px;background:#8e5cf2;clip-path:polygon(50% 0,100% 100%,0 100%)}.hero .head{position:absolute;left:18px;top:25px;width:23px;height:23px;border-radius:50%;background:#edba9b}.hero .robe{position:absolute;left:7px;top:44px;width:46px;height:30px;background:linear-gradient(90deg,#5832a2,#b188ff);clip-path:polygon(24% 0,77% 0,100% 100%,0 100%);border-radius:9px}.hero .staff{position:absolute;left:52px;top:19px;width:5px;height:55px;background:#e7c076;transform:rotate(18deg)}.hero .staff:before{content:"";position:absolute;top:-10px;left:-9px;width:22px;height:22px;border-radius:50%;background:#86efff;box-shadow:0 0 24px #65dfff}.enemy{width:45px;height:45px;border-radius:40% 45% 35% 50%;background:linear-gradient(140deg,#b13b88,#511944);border:3px solid #f67db8;box-shadow:0 0 18px #f34e8b70}.enemy:before{content:'◉ ◉';position:absolute;left:4px;top:8px;color:#ffeb9e;font-size:14px}.enemy.boss{width:94px;height:94px;border-width:6px;box-shadow:0 0 45px #fa4b9e}.bolt{width:18px;height:18px;border-radius:50%;background:#a6faff;box-shadow:0 0 22 .65;color:#d3c6e5}.start{border:0;background:linear-gradient(120deg,#8650ef,#d04cbb);color:#fff;border-radius:14px;padding:17px 25px;font-weight:900;font-size:17px;cursor:pointer;min-width:220px;margin-top:12px}.note{font-size:12px;color:#b6a9d2;margin-top:15px}.toast{position:fixed;top:110px;left:50%;transform:translateX(-50%);z-index:7;font-size:19px;font-weight:900;color:#ffde93;text-shadow:0 0 20px #e6a352;text-align:center;pointer-events:none}#error{position:fixed;z-index:30;top:0;left:0;right:0;background:#a3274c;color:white;padding:12px;display:none;font-size:13px} @media(max-width:380px){.pad{width:110px;height:110px}.knob{left:34px;top:34px}.act{width:68px;height:68px}.act.dash{width:55px;height:55px}.logo{font-size:12px}}
</style></head><body><div id="world"><div class="orb"></div><div class="orb two"></div><div id="hero" class="entity hero"><div class="hat"></div><div class="head"></div><div class="robe"></div><div class="staff"></div></div></div><div class="hud"><div class="panel"><div class="logo">✦ GIG QUEST</div><div class="small" id="heroInfo">HERO · LEVEL 1</div><div class="meter"><div class="fill" id="hpBar"></div></div><div class="small" id="hpText">100 HP · 0 XP</div></div><div class="panel right"><div class="small" id="waveText">WAVE 1 / 3</div><strong id="enemyText">SHADOW MINIONS</strong><div class="meter"><div class="fill" id="bossBar"></div></div><div class="small" id="goldText">✦ 0 GOLD</div></div></div><div class="toast" id="toast"></div><div class="controls"><div class="pad" id="pad"><div class="knob" id="knob"></div></div><div class="buttons"><button class="act dash" id="dash">✧<small>DASH</small></button><button class="act" id="attack">⚡<small>ATTACK</small></button></div></div><div id="screen"><div class="menu"><div class="kicker">GIG PRESENTS</div><h1 id="heading">SHADOW<br>FALL</h1><p id="description">Enter the arena. Move your wizard, blast approaching enemies, survive three waves and defeat the Shadow King.</p><button class="start" id="start">⚔ ENTER THE ARENA</button><div class="note">Touch joystick + ATTACK / DASH · Keyboard WASD + SPACE + SHIFT</div></div></div><div id="error"></div><script>
(function(){'use strict';var $=function(id){return document.getElementById(id)};window.onerror=function(msg){$('error').style.display='block';$('error').textContent='Game error: '+msg};var world=$('world'),heroEl=$('hero'),w=innerWidth,h=innerHeight,playing=false,wave=1,kills=0,xp=0,gold=0,level=1,last=0,spawnClock=0,toastTime=0,inv=0,attackCooldown=0,dashCooldown=0,joy={x:0,y:0},keys={},hero={x:w/2,y:h/2,hp:100},enemies=[],bolts=[],nextId=0;function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function distance(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function place(el,x,y){el.style.left=x+'px';el.style.top=y+'px'}function make(cls,x,y){var e=document.createElement('div');e.className='entity '+cls;world.appendChild(e);place(e,x,y);return e}function clearObjects(){enemies.forEach(function(e){e.el.remove()});bolts.forEach(function(e){e.el.remove()});enemies=[];bolts=[]}function spawn(boss){var side=Math.floor(Math.random()*4),x=side===0?0:side===1?w:Math.random()*w,y=side===2?0:side===3?h:Math.random()*h;if(boss){x=w/2;y=Math.max(135,h*.2)}var e={id:++nextId,x:x,y:y,hp:boss?450:wave===2?65:42,max:boss?450:wave===2?65:42,speed:boss?47:wave===2?80:65,boss:boss,el:make('enemy'+(boss?' boss':''),x,y)};enemies.push(e)}function say(msg){$('toast').textContent=msg;toastTime=1.1}function hud(){var b=enemies.find(function(e){return e.boss});$('hpBar').style.width=hero.hp+'%';$('hpText').textContent=Math.ceil(hero.hp)+' HP · '+xp+' XP';$('heroInfo').textContent='HERO · LEVEL '+level;$('waveText').textContent='WAVE '+wave+' / 3';$('enemyText').textContent=wave===3?'SHADOW KING':'SHADOW MINIONS';$('bossBar').style.width=wave===3&&b?(100*b.hp/b.max)+'%':wave===3?'100%':Math.min(100,100*kills/(wave===1?7:10))+'%';$('goldText').textContent='✦ '+gold+' GOLD'}function finish(win){playing=false;$('screen').style.display='flex';$('heading').innerHTML=win?'VICTORY!':'GAME OVER';$('description').textContent=win?'The Shadow King has fallen! You earned '+xp+' XP and '+gold+' Gold.':'The arena defeated you. Your score: '+xp+' XP and '+gold+' Gold.';$('start').textContent='⚔ PLAY AGAIN'}function start(){clearObjects();playing=true;wave=1;kills=0;xp=0;gold=0;level=1;spawnClock=0;hero.x=w/2;hero.y=h/2;hero.hp=100;inv=0;attackCooldown=0;dashCooldown=0;$('screen').style.display='none';say('⚔ WAVE ONE');hud()}$('start').addEventListener('click',start);function attack(){if(!playing||attackCooldown>0)return;attackCooldown=.23;var target=null,nearest=Infinity;enemies.forEach(function(e){var d=distance(hero,e);if(d<nearest){nearest=d;target=e}});var dx=target?target.x-hero.x:1,dy=target?target.y-hero.y:0,len=Math.hypot(dx,dy)||1;dx/=len;dy/=len;var shot={x:hero.x+dx*24,y:hero.y+dy*24,vx:dx*580,vy:dy*580,life:1.1,el:make('bolt',hero.x,hero.y)};bolts.push(shot)}function dash(){if(!playing||dashCooldown>0)return;dashCooldown=2.3;inv=.45;var dx=joy.x+(keys.d||keys.ArrowRight?1:0)-(keys.a||keys.ArrowLeft?1:0),dy=joy.y+(keys.s||keys.ArrowDown?1:0)-(keys.w||keys.ArrowUp?1:0);var len=Math.hypot(dx,dy)||1;hero.x=clamp(hero.x+dx/len*125,35,w-35);hero.y=clamp(hero.y+dy/len*125,105,h-40);say('✧ DASH')} $('attack').addEventListener('click',attack);$('dash').addEventListener('click',dash);addEventListener('keydown',function(e){keys[e.key]=true;if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].indexOf(e.key)>=0)e.preventDefault();if(e.key===' ')attack();if(e.key==='Shift')dash()});addEventListener('keyup',function(e){keys[e.key]=false});var pad=$('pad'),knob=$('knob');function padMove(e){var r=pad.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,mag=Math.hypot(dx,dy),max=r.width*.33,ratio=Math.min(mag,max)/(mag||1);joy.x=dx/(mag||1)*Math.min(1,mag/max);joy.y=dy/(mag||1)*Math.min(1,mag/max);knob.style.transform='translate('+(dx*ratio)+'px,'+(dy*ratio)+'px)'}pad.addEventListener('pointerdown',function(e){pad.setPointerCapture(e.pointerId);padMove(e)});pad.addEventListener('pointermove',function(e){if(e.buttons||e.pointerType==='touch')padMove(e)});function resetPad(){joy.x=0;joy.y=0;knob.style.transform='translate(0,0)'}pad.addEventListener('pointerup',resetPad);pad.addEventListener('pointercancel',resetPad);addEventListener('resize',function(){w=innerWidth;h=innerHeight;hero.x=clamp(hero.x,30,w-30);hero.y=clamp(hero.y,110,h-30)});function tick(time){var dt=Math.min((time-last)/1000||.016,.045);last=time;if(playing){inv=Math.max(0,inv-dt);attackCooldown=Math.max(0,attackCooldown-dt);dashCooldown=Math.max(0,dashCooldown-dt);spawnClock+=dt;var dx=joy.x+(keys.d||keys.ArrowRight?1:0)-(keys.a||keys.ArrowLeft?1:0),dy=joy.y+(keys.s||keys.ArrowDown?1:0)-(keys.w||keys.ArrowUp?1:0),len=Math.max(1,Math.hypot(dx,dy));hero.x=clamp(hero.x+dx/len*220*dt,32,w-32);hero.y=clamp(hero.y+dy/len*220*dt,105,h-38);if(wave<3&&spawnClock>1.25&&enemies.length<5){spawnClock=0;spawn(false)}if(wave===3&&enemies.length===0&&kills===0){spawn(true);say('👑 SHADOW KING')}enemies.slice().forEach(function(e){var d=distance(hero,e)||1;e.x+=(hero.x-e.x)/d*e.speed*dt;e.y+=(hero.y-e.y)/d*e.speed*dt;place(e.el,e.x,e.y);if(d<(e.boss?64:35)&&inv<=0){hero.hp=Math.max(0,hero.hp-(e.boss?19:12));inv=.8;say('💥 -'+(e.boss?19:12)+' HP');if(hero.hp<=0)finish(false)}});bolts.slice().forEach(function(b){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;place(b.el,b.x,b.y);var hit=enemies.find(function(e){return distance(b,e)<(e.boss?56:31)});if(hit){hit.hp-=38+level*5;b.life=0;hit.el.style.filter='brightness(2)';if(hit.hp<=0){hit.el.remove();enemies=enemies.filter(function(e){return e!==hit});xp+=hit.boss?600:45;gold+=hit.boss?250:20;if(hit.boss){finish(true)}else{kills++;if(xp>=level*180){level++;say('⭐ LEVEL UP!')}if(wave===1&&kills>=7){wave=2;kills=0;clearObjects();say('⚡ WAVE TWO')}else if(wave===2&&kills>=10){wave=3;kills=0;clearObjects();say('👑 FINAL BOSS')}}}}if(b.life<=0||b.x<0||b.x>w||b.y<0||b.y>h){b.el.remove();bolts=bolts.filter(function(x){return x!==b})}});heroEl.style.opacity=inv>0&&Math.floor(time/90)%2===0?'.5':'1';place(heroEl,hero.x,hero.y);hud()}if(toastTime>0){toastTime-=dt;if(toastTime<=0)$('toast').textContent=''}requestAnimationFrame(tick)}place(heroEl,hero.x,hero.y);hud();requestAnimationFrame(tick)})();
</script></body></html>
